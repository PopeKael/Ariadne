services:
  ariadne-signal-service:
    build: .
    container_name: ariadne-signal-service
    restart: unless-stopped
    ports:
      - "8788:8788"
    environment:
      SIGNAL_SERVICE_BIND_ADDRESS: 0.0.0.0
      SIGNAL_SERVICE_PORT: 8788
      SIGNAL_SERVICE_DATABASE: /data/signals.sqlite3
      SIGNAL_SERVICE_REFRESH_SECONDS: 900
      SIGNAL_SERVICE_DISABLE_BUILTIN_FEEDS: "true"
      SIGNAL_SERVICE_BRIEFING_POOL: 240
    volumes:
      - ./data:/data
